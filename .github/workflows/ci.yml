name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked

  python:
    name: Python ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: python -m pip install --upgrade pip pytest ruff mypy
      - name: Build extension
        run: python -m pip install .
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check python tests examples scripts
      - name: Format check
        run: python -m ruff format --check python tests examples scripts
      - name: Type check
        run: python -m mypy

  report:
    name: Reproducible report ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: python -m pip install --upgrade pip
      - name: Build extension
        run: python -m pip install .
      - name: Generate example report
        run: python examples/run_example.py
      - name: Verify committed report hash
        run: python scripts/verify_report.py
      - name: Prove the trap is detected
        run: python -m backtest_engine check --strategy lookahead_trap --expect-detected
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.os }}
          path: reports/example.html

  case-study:
    name: Real-data case study ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: python -m pip install --upgrade pip
      - name: Build extension
        run: python -m pip install .
      - name: Rebuild real-data report
        run: python scripts/build_case_study.py
      - name: Verify committed case study hash
        run: python scripts/verify_case_study.py
      - name: Prove the subtle leak is detected
        run: python -m backtest_engine check --strategy full_sample_zscore --expect-detected
      - name: Upload case study
        uses: actions/upload-artifact@v7
        with:
          name: case-study-${{ matrix.os }}
          path: docs/case_study.html
