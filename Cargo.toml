[package]
name = "backtest-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Event-driven backtesting engine that proves the absence of look-ahead bias"
authors = ["Iker Abad"]
repository = "https://github.com/IkerAbad/backtest-engine"
readme = "README.md"

[lib]
name = "_backtest_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
csv = "1.3"
sha2 = "0.10"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
